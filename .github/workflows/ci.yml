name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "argocd/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  build-and-deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the new image tag
      packages: write   # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v7
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          push: true
      - uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - name: Point the deployment at the new image
        run: |
          sed -i "s|image: ghcr.io/.*|image: ${IMAGE}|" deploy/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
